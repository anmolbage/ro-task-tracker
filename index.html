<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3b0a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RO Tasks">
<title>RO Task Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login">
  <div class="logo"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg></div>
  <h1>RO Task Tracker</h1>
  <p class="tag" id="loginTag">Who has which task in RO Hazaribag</p>

  <div class="field">
    <label for="loginUser">Username</label>
    <input id="loginUser" autocomplete="username" autocapitalize="none" placeholder="rm or anmol">
  </div>

  <div class="field">
    <label>PIN</label>
    <div class="pindots" id="pinDots"></div>
  </div>

  <div class="pinpad" id="pinPad"></div>

  <button class="btn pri full" id="loginBtn">Sign in</button>
  <p class="tag" id="loginMsg" style="margin:14px 0 0;min-height:20px;color:var(--danger);font-weight:600"></p>
  <button class="btn ghost sm hidden" id="netCheckBtn" style="margin:6px auto 0;display:flex">Run connection check</button>
  <pre id="netCheck" class="hidden" style="margin:10px 0 0;padding:10px;border-radius:10px;background:var(--surface-2);font-size:11.5px;line-height:1.5;white-space:pre-wrap;text-align:left;user-select:text"></pre>
</div>

<!-- ======================= APP ======================= -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <div>
        <h1>RO Task Tracker</h1>
        <div class="sub" id="subline">RO Hazaribag</div>
      </div>
      <div class="right">
        <button class="bell" id="syncBtn" aria-label="Sync now" title="Sync now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
        <button class="bell" id="bell" aria-label="Reminders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge num" id="bellBadge" hidden></span></button>
      </div>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Give a task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
</div>

<div id="layer"></div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
