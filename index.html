<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RO Task Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column (max 560px), aubergine sticky header with a reminder bell, five bottom tabs, bottom sheets for detail.
   Palette: deep aubergine + violet accent (deliberately unlike the navy/teal branch apps). Who-colours: RO staff teal, branch orange, circular blue. */
:root{
  --brand:#4a1259; --brand-2:#7e22ce;
  --bg:#f6f3f8; --surface:#ffffff; --surface-2:#f8f5fb; --line:#e8e1ee;
  --text:#1c1026; --text-2:#5f5370; --text-3:#9b90a8;
  --ok:#0f9d58; --warn:#c77700; --danger:#d93036; --crit:#b4123a;
  --w-staff:#0f766e; --w-branch:#c2410c; --w-many:#0369a1; --ho:#1d4ed8;
  --head-bg:#3b0a45; --head-fg:#ffffff; --head-fg-2:#d9c3e0; --proto:#ffd27a;
  --hero-a:#3b0a45; --hero-b:#7b2d8e; --wa:#128c4a;
  --shadow:0 1px 2px rgba(28,16,38,.04),0 8px 24px rgba(28,16,38,.07);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#5b1a6e; --brand-2:#c084fc;
  --bg:#120a1a; --surface:#1c1226; --surface-2:#241733; --line:#352444;
  --text:#f3eefa; --text-2:#b4a6c4; --text-3:#7d6f8e;
  --ok:#3ccf8e; --warn:#f2b441; --danger:#ff6b70; --crit:#ff7a93;
  --w-staff:#2dd4bf; --w-branch:#fb8c4a; --w-many:#5fb4ff; --ho:#7aa2ff;
  --head-bg:#1a0f24; --head-fg:#f3eefa; --head-fg-2:#b093c4; --wa:#3ccf8e;
  --hero-a:#2a0f3a; --hero-b:#5b1f6e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5b1a6e; --brand-2:#c084fc;
  --bg:#120a1a; --surface:#1c1226; --surface-2:#241733; --line:#352444;
  --text:#f3eefa; --text-2:#b4a6c4; --text-3:#7d6f8e;
  --ok:#3ccf8e; --warn:#f2b441; --danger:#ff6b70; --crit:#ff7a93;
  --w-staff:#2dd4bf; --w-branch:#fb8c4a; --w-many:#5fb4ff; --ho:#7aa2ff;
  --head-bg:#1a0f24; --head-fg:#f3eefa; --head-fg-2:#b093c4; --wa:#3ccf8e;
  --hero-a:#2a0f3a; --hero-b:#5b1f6e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}

#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-fg);
  padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.top .sub{font-size:12.5px;color:var(--head-fg-2)}
.top .right{display:flex;align-items:center;gap:8px}
.proto{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;
  background:color-mix(in srgb,var(--proto) 18%,transparent);color:var(--proto);white-space:nowrap}
.bell{position:relative;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:var(--head-fg)}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;line-height:18px;text-align:center}

main{display:flex;flex-direction:column;gap:14px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px}
h2.sec{font-size:15px;margin:0;font-weight:700}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.link{font-size:13px;font-weight:600;color:var(--brand-2)}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:12.5px}
.empty{padding:18px 12px;text-align:center;color:var(--text-3);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r)}

/* Hero */
.hero{padding:18px;border-radius:20px;background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:#fff;
  box-shadow:0 10px 30px rgba(91,31,110,.28);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.78;font-weight:600}
.hero .value{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}
.hero .hnote{font-size:13px;opacity:.85}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative}
.hero-chip{background:rgba(255,255,255,.14);border-radius:12px;padding:9px 10px;min-width:0;text-align:left;border:1px solid transparent;width:100%}
.hero-chip:hover,.hero-chip.on{border-color:rgba(255,255,255,.55)}
.hero-chip b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.hero-chip span{font-size:10.5px;opacity:.85;font-weight:500;line-height:1.25;display:block}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 11px;box-shadow:var(--shadow);text-align:left;width:100%;min-width:0;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--h,var(--brand-2))}
.stat b{display:block;font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.2;color:var(--brand-2)}
.stat span{font-size:11.5px;color:var(--text-2);font-weight:600;line-height:1.3;display:block;margin-top:2px}
.stat small{display:block;font-size:11px;color:var(--text-3);margin-top:3px}
.stat.bad b{color:var(--danger)}

/* Category rows */
.cats{display:grid;gap:2px}
.srow{display:grid;grid-template-columns:1fr 40px 70px;gap:8px;align-items:center;padding:8px 6px;border-radius:var(--r-sm);width:100%;text-align:left}
.srow:hover{background:var(--surface-2)}
.sname{display:flex;flex-direction:column;gap:4px;min-width:0}
.sname .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand-2)}
.bar i.red{background:var(--danger)}
.bar.all i{background:var(--ok)}
.srow .c{text-align:right;font-weight:700}
.srow .a{text-align:right;color:var(--text-2);font-size:12.5px}
.srow .a.bad{color:var(--danger);font-weight:700}

/* Compact summary cards on Today */
.sum{padding:11px 12px}
.sum .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.sum .hd h2{font-size:13.5px;margin:0;font-weight:700}
.sum .hd span{font-size:11.5px;color:var(--text-3);font-weight:600}
.sum .row{display:flex;flex-wrap:wrap;gap:6px}
.sp{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-2);max-width:100%}
.sp:hover{border-color:color-mix(in srgb,var(--brand-2) 40%,var(--line))}
.sp .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp b{color:var(--brand-2);font-variant-numeric:tabular-nums}
.sp .l{color:var(--danger);font-weight:800;font-variant-numeric:tabular-nums}
.sp.more{color:var(--brand-2);background:transparent;border-style:dashed}
.sp.hot{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}

/* Pills and dates */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:99px;white-space:nowrap;
  color:var(--h,var(--text-2));background:color-mix(in srgb,var(--h,var(--text-2)) 13%,transparent)}
.p-ho{--h:var(--ho)} .p-crit{--h:var(--crit)} .p-staff{--h:var(--w-staff)} .p-branch{--h:var(--w-branch)} .p-many{--h:var(--w-many)}
.p-done{--h:var(--ok)} .p-dist{--h:var(--warn)} .p-audit{--h:var(--text-2)} .p-cat{--h:var(--brand-2)} .p-rem{--h:var(--text-3)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap}
.due.over{color:var(--danger)} .due.today{color:var(--warn)} .due.done{color:var(--ok)}
.late{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);white-space:nowrap}

/* Task rows */
.list{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.trow:hover{border-color:color-mix(in srgb,var(--brand-2) 40%,var(--line))}
.trow.done{opacity:.72}
.trow .who{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.trow .who i{width:8px;height:8px;border-radius:50%;background:var(--h);flex:none;display:inline-block}
.trow .who .r{font-weight:500;color:var(--text-3);font-size:12px}
.trow .tags{display:flex;gap:4px;justify-content:flex-end;align-items:center;flex-wrap:wrap;max-width:58%}
.trow .txt{grid-column:1/-1;font-size:14px;line-height:1.4}
.trow.done .txt{text-decoration:line-through;color:var(--text-2)}
.trow .r3{grid-column:1/-1;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-top:2px}
.trow .how{font-size:12px;color:var(--text-3)}
.trow .cat{font-size:11.5px;color:var(--brand-2);font-weight:600}

/* People */
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.prow:hover{border-color:color-mix(in srgb,var(--brand-2) 40%,var(--line))}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--h,var(--brand-2));flex:none}
.pm{min-width:0}.pm .n{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm .r{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .sub{color:var(--w-staff);font-weight:600;font-size:11.5px}
.pc{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--text-2);white-space:nowrap}
.pc b{font-size:13px;color:var(--brand-2)} .pc b.bad{color:var(--danger)} .pc b.ok{color:var(--ok)}
.sort{display:flex;gap:6px;flex-wrap:wrap}

/* Circulars, branches */
.circ{display:grid;gap:8px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.circ:hover{border-color:color-mix(in srgb,var(--brand-2) 40%,var(--line))}
.circ .t{font-weight:700;font-size:14px}
.circ .bar i{background:var(--w-many)}
.circ .m{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-2)}
.brow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.brow .n{font-weight:700} .brow .code{font-size:12px;color:var(--text-3);font-weight:500}
.ticks{display:grid;gap:4px}
.tick{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 8px;border-radius:var(--r-sm);text-align:left;width:100%}
.tick:hover{background:var(--surface-2)}
.tick .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.tick.on .box{background:var(--ok);border-color:var(--ok)}
.tick .box svg{width:14px;height:14px}
.tick.on .nm{color:var(--text-2)}
.tick .st{font-size:12px;color:var(--text-3)}

/* Chips, search, buttons */
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap;color:var(--text-2)}
.chip.on{background:var(--brand);color:#fff;border-color:transparent}
.chip .k{font-size:11px;font-weight:700;opacity:.75}
.chip.x{padding-right:6px}
.chip .del{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);margin-left:2px}
.chip .del:hover{color:var(--danger);background:var(--surface-2)}
.chip .del svg{width:11px;height:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:11px;font-weight:600;font-size:14px;background:var(--surface-2);border:1px solid var(--line);text-align:center}
.btn.pri{background:var(--brand);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.wa{background:var(--wa);color:#fff;border-color:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.ghost{background:transparent}
.btn:disabled,.btn.off{opacity:.5;cursor:default;pointer-events:none}
.btn.full{width:100%}
.btn.sm{padding:7px 11px;font-size:13px}
.btn svg{width:17px;height:17px;flex:none}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,8,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-head h3{margin:0;font-size:18px;letter-spacing:-.01em;line-height:1.3}
.sh-head .k{font-size:12.5px;color:var(--text-2);margin-top:3px}
.close{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.close svg{width:18px;height:18px}
.sh-body{display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv>div{min-width:0}.kv .l{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kv .v{font-weight:600;font-size:14px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl li:last-child{border-bottom:0}
.tl .d{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--brand-2)}
.tl .d.bad{background:var(--danger)} .tl .d.ok{background:var(--ok)}
.tl .w{color:var(--text-3);font-size:12px;text-align:right;white-space:nowrap}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.inp{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--text)}
textarea.inp{resize:vertical;line-height:1.5;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
.quick button.on{background:var(--brand);color:#fff;border-color:transparent}
.toggle{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.toggle button{padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2);text-align:center}
.toggle button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.sw .t{font-weight:600;font-size:14px}.sw .s{font-size:12px;color:var(--text-2)}
.knob{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.knob::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.knob.on{background:var(--crit)}.knob.on::after{left:21px}
.knob.ok.on{background:var(--ok)}
.note{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;line-height:1.5}
.msg{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;user-select:text}

/* More tab */
.feat{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:0}
.feat .ic{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--brand-2) 12%,transparent);color:var(--brand-2);display:grid;place-items:center}
.feat .ic svg{width:19px;height:19px}
.feat b{display:block;font-size:14px}
.feat p{margin:2px 0 0;font-size:13px;color:var(--text-2);line-height:1.45}
.menu{display:grid}
.mrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--brand-2) 12%,transparent);color:var(--brand-2);display:grid;place-items:center}
.mrow .ic svg{width:18px;height:18px}
.mrow b{display:block;font-size:14px}.mrow span.s{font-size:12.5px;color:var(--text-2)}
.mrow .chev{color:var(--text-3)} .mrow .chev svg{width:18px;height:18px}
.erow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.erow:last-child{border-bottom:0}
.erow .n{font-weight:600;font-size:14px}.erow .s{font-size:12px;color:var(--text-2)}
.erow .mob{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.erow .mob.set{color:var(--brand-2);font-weight:600}
.ulist{display:grid}
.urow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .n{font-weight:700;font-size:14px}.urow .s{font-size:12px;color:var(--text-2)}
.lim{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lim>*{min-width:0}
.catgrp{padding:10px 0;border-bottom:1px solid var(--line)}
.catgrp:last-child{border-bottom:0}
.catgrp .g{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;margin-bottom:6px}
.catgrp .g span{font-size:12px;color:var(--text-3);font-weight:600}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:600;color:var(--text-3);text-align:center}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--brand-2)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;line-height:17px}
.fab{position:fixed;z-index:21;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:17px;background:var(--brand-2);color:#fff;box-shadow:0 8px 24px rgba(126,34,206,.4);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}.hero-chip b{font-size:17px}.srow{grid-template-columns:1fr 36px 62px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.22,1,.36,1)}@keyframes up{from{transform:translateY(30px)}}}

function build(r){
  const t=Object.assign({},r);
  t.given=day(r.given);t.due=day(r.due);t.status=r.done!=null?'done':'open';t.doneOn=r.done!=null?day(r.done):null;delete t.done;
  t.hist=r.hist.map(h=>({d:day(h[0]),k:h[1],x:h[2]||''}));t.snooze=null;
  if(t.to.type==='many'){
    const codes=t.to.codes==='all'?DEFAULT_BRANCHES.map(b=>b.code):t.to.codes.slice();
    const pend=new Set(t.to.pending);
    t.to={type:'many',codes,replied:Object.fromEntries(codes.map(c=>[c,!pend.has(c)]))};
  }
  return t;
}

const open=t=>t.status==='open';

const isToday=t=>open(t)&&t.due===TODAY;

const isSoon=t=>open(t)&&t.due>TODAY&&t.due<=TODAY+CFG.remindBefore*DAY;
const isReminder=t=>(isOver(t)||isToday(t)||isSoon(t))&&!(t.snooze&&t.snooze>TODAY);

  if(t.to.type==='branch'){const b=branchOf(t.to.code);return b?b.name:(t.to.name||'Branch '+t.to.code)}
  return t.to.codes.length===CFG.branches.length?'All '+CFG.branches.length+' branches':t.to.codes.length+' branches'};
const whoRole=t=>{if(t.to.type==='staff'){const s=staffOf(t.to.id);return s?s.role:'left RO'}return t.to.type==='branch'?'Branch · '+t.to.code:'Circular'};
const whoClass=t=>t.to.type==='staff'?'p-staff':t.to.type==='branch'?'p-branch':'p-many';
const pendingOf=t=>t.to.codes.filter(c=>!t.to.replied[c]);
const remCount=t=>t.hist.filter(h=>h.k==='rem').length;
const byUrgency=ts=>ts.slice().sort((a,b)=>(open(b)-open(a))||(b.crit?1:0)-(a.crit?1:0)||a.due-b.due);
const byDue=ts=>ts.slice().sort((a,b)=>(open(b)-open(a))||a.due-b.due);
const staffTasks=id=>TASKS.filter(t=>t.to.type==='staff'&&t.to.id===id);
const branchTasks=code=>TASKS.filter(t=>t.to.type==='branch'&&t.to.code===+code);
const oldestDays=ts=>ts.length?Math.round((TODAY-Math.min(...ts.map(t=>t.given)))/DAY):0;

// ---------- Row renderers ----------
function dueHtml(t){
  if(!open(t))return '<span class="due done">Done '+pretty(t.doneOn)+(t.doneOn>t.due?' · '+plural(Math.round((t.doneOn-t.due)/DAY),'day')+' late':'')+'</span>';
  if(isOver(t))return '<span class="due over">Due '+pretty(t.due)+'</span><span class="late">'+plural(daysLate(t),'day')+' late</span>';
  if(isToday(t))return '<span class="due today">Due today</span>';
  if(isTomorrow(t))return '<span class="due">Due tomorrow</span>';
  return '<span class="due">Due '+pretty(t.due)+'</span>';
}
function tagsHtml(t){
  let s='';
  if(t.crit&&open(t))s+='<span class="pill p-crit">Critical</span>';
  if(SRC_PILL[t.src])s+='<span class="pill '+SRC_PILL[t.src][0]+'">'+SRC_PILL[t.src][1]+'</span>';
  if(t.to.type==='many'&&open(t))s+='<span class="pill p-many">'+pendingOf(t).length+' pending</span>';
  if(open(t)&&remCount(t)>1)s+='<span class="pill p-rem">reminded ×'+remCount(t)+'</span>';
  return s;
}
function taskRow(t,opts){
  opts=opts||{};
  const who=opts.hideWho?'':'<div class="who '+whoClass(t)+'"><i></i>'+esc(whoName(t))+' <span class="r">'+esc(whoRole(t))+'</span></div>';
  return '<button class="trow '+(open(t)?'':'done')+'" data-task="'+t.id+'">'+who+
    '<div class="tags"'+(opts.hideWho?' style="grid-column:1/-1;justify-content:flex-start;max-width:none"':'')+'>'+tagsHtml(t)+'</div>'+
    '<div class="txt">'+esc(t.text)+'</div>'+
    '<div class="r3">'+dueHtml(t)+(t.cat?'<span class="cat">'+esc(t.cat)+'</span>':'')+'<span class="how">'+esc(t.how)+' · given '+pretty(t.given)+'</span></div></button>';
}
function listHtml(ts,opts){return ts.length?'<div class="list">'+ts.map(t=>taskRow(t,opts)).join('')+'</div>':'<div class="empty">'+(opts&&opts.empty||'Nothing here')+'</div>'}
function section(title,count,body,extra){
  return '<section><div class="sec-row"><h2 class="sec">'+title+(count!=null?' <span class="muted">'+count+'</span>':'')+'</h2>'+(extra||'')+'</div>'+body+'</section>';

const LIMIT=5;
function summaryCard(key,title,items,sub){
  const rows=items.filter(x=>x.n).sort((a,b)=>b.ov-a.ov||b.n-a.n);
  if(!rows.length)return '';
  const all=!!S.expand[key],shown=all?rows:rows.slice(0,LIMIT);
  return '<div class="card sum"><div class="hd"><h2>'+title+'</h2><span>'+sub+'</span></div><div class="row">'+
    shown.map(r=>'<button class="sp '+(r.ov?'hot':'')+'" '+r.attrs+'><span class="n">'+esc(r.label)+'</span><b>'+r.n+'</b>'+(r.ov?'<span class="l">'+r.ov+'</span>':'')+'</button>').join('')+
    (rows.length>LIMIT?'<button class="sp more" data-expand="'+key+'">'+(all?'less':'+'+(rows.length-LIMIT)+' more')+'</button>':'')+'</div></div>';
}
function renderToday(){
  const over=byUrgency(TASKS.filter(isOver)),td=byUrgency(TASKS.filter(isToday)),tm=byUrgency(TASKS.filter(isTomorrow));
  const crit=byUrgency(TASKS.filter(t=>open(t)&&t.crit));
  const roOpen=TASKS.filter(t=>open(t)&&t.to.type==='staff').length;
  const brOpen=TASKS.filter(t=>open(t)&&t.to.type!=='staff').length;
  const hoOpen=TASKS.filter(t=>open(t)&&t.src==='ho').length;
  const chip=(k,n,l)=>'<button class="hero-chip '+(S.chase===k?'on':'')+'" data-chase="'+k+'"><b class="num">'+n+'</b><span>'+l+'</span></button>';
  let html='<div class="hero"><div class="label">To chase today</div><div class="value num">'+(over.length+td.length)+'</div>'+
    '<div class="hnote">'+plural(over.length,'overdue task')+' and '+td.length+' due today · '+DOW[new Date(TODAY).getDay()]+' '+pretty(TODAY)+'</div>'+
    '<div class="hero-row">'+chip('over',over.length,'Overdue')+chip('today',td.length,'Due today')+chip('tomorrow',tm.length,'Due tomorrow')+'</div></div>';
  html+='<div class="stats">'+
    '<button class="stat" style="--h:var(--w-staff)" data-go="people"><b class="num">'+roOpen+'</b><span>open with RO staff</span><small>who has what</small></button>'+
    '<button class="stat" style="--h:var(--w-branch)" data-go="branches"><b class="num">'+brOpen+'</b><span>open with branches</span><small>incl. circulars</small></button>'+
    '<button class="stat '+(hoOpen?'bad':'')+'" style="--h:var(--ho)" data-go="tasks" data-filter="ho"><b class="num">'+hoOpen+'</b><span>from HO, still open</span><small>what HO will chase</small></button></div>';
  // Compact summaries: by category group, by RO staff, by branch
  const openT=TASKS.filter(open);
  const stat=(label,ts,attrs)=>({label,n:ts.length,ov:ts.filter(isOver).length,attrs});
  const cats=CFG.cats.map(g=>stat(g.group,openT.filter(t=>groupOf(t.cat)===g.group),'data-go="tasks" data-grp="'+esc(g.group)+'" data-filter="open"'));
  const ppl=CFG.staff.map(s=>stat(s.name.split(' ')[0],openT.filter(t=>t.to.type==='staff'&&t.to.id===s.id),'data-person="'+s.id+'"'));
  const brs=CFG.branches.map(b=>stat(b.name,openT.filter(t=>t.to.type==='branch'&&t.to.code===b.code),'data-branch="'+b.code+'"'));
  html+=summaryCard('ppl','By RO staff',ppl,'open · <span style="color:var(--danger)">late</span> · '+CFG.staff.filter(s=>!openT.some(t=>t.to.type==='staff'&&t.to.id===s.id)).length+' with nothing pending');
  html+=summaryCard('cats','By category',cats,'open · <span style="color:var(--danger)">late</span>');
  html+=summaryCard('brs','By branch',brs,(CFG.branches.length-brs.filter(x=>x.n).length)+' branches with no task');
  if(crit.length&&S.chase==='all')html+=section('Critical',crit.length,listHtml(crit),'<span class="small faint">flagged by you</span>');
  if(S.chase==='all'||S.chase==='over')html+=section('Overdue',over.length,listHtml(over,{empty:'Nothing overdue. Good.'}),'<span class="small faint">critical first, then oldest</span>');
  if(S.chase==='all'||S.chase==='today')html+=section('Due today',td.length,listHtml(td,{empty:'Nothing due today'}));
  if(S.chase==='all'||S.chase==='tomorrow')html+=section('Due tomorrow',tm.length,listHtml(tm,{empty:'Nothing due tomorrow'}));
  return html;
}
function renderPeople(){

function renderBranches(){

function renderTasks(){
  const F={open:t=>open(t),over:isOver,crit:t=>open(t)&&t.crit,ho:t=>t.src==='ho',done:t=>!open(t),all:()=>true};
  const q=S.q.trim().toLowerCase();
  let ts=TASKS.filter(F[S.filter]||F.open);
  if(S.grp)ts=ts.filter(t=>groupOf(t.cat)===S.grp);
  if(q)ts=ts.filter(t=>(t.text+' '+whoName(t)+' '+whoRole(t)+' '+t.id+' '+(t.cat||'')+' '+t.hist.map(x=>x.x).join(' ')).toLowerCase().includes(q));
  ts=S.filter==='done'?ts.slice().sort((a,b)=>b.doneOn-a.doneOn):byDue(ts);
  const counts=Object.fromEntries(Object.keys(F).map(k=>[k,TASKS.filter(F[k]).filter(t=>!S.grp||groupOf(t.cat)===S.grp).length]));
  const chips=[['open','Open'],['over','Overdue'],['crit','Critical'],['ho','From HO'],['done','Done'],['all','All']];
  const grps=CFG.cats.map(g=>g.group).filter(g=>TASKS.some(t=>groupOf(t.cat)===g));

  html+=CFG.cats.map(g=>'<optgroup label="'+esc(g.group)+'">'+g.items.map(c=>'<option '+(current===c&&!(s&&s.cats.includes(c))?'selected':'')+'>'+esc(c)+'</option>').join('')+'</optgroup>').join('');

function openGive(pre){

    '<div class="sw" style="margin-top:10px"><div><div class="t">Critical</div><div class="s">Sits on top of Today until done</div></div><button type="button" class="knob" id="g-crit" aria-pressed="false" aria-label="Critical"></button></div>'+
    '<label class="f" style="margin-top:10px">Note (optional)<input class="inp" id="g-note" placeholder="Reference, letter number, who asked…"></label>'+
    '<button class="btn pri full" type="submit" style="margin-top:14px">Save task</button>'+

  const who=$('#g-who');
  const drawWho=()=>{
    if(G.type==='staff'){const s=G.staff?staffOf(G.staff):null;
      who.innerHTML='<label class="f">To whom</label><div class="quick" style="margin-top:6px">'+CFG.staff.map(x=>'<button type="button" data-gs="'+x.id+'" class="'+(G.staff===x.id?'on':'')+'" title="'+esc(x.role)+'">'+esc(x.name)+'</button>').join('')+'</div>'+(s?'<p class="small muted" style="margin:6px 0 0"><b>'+esc(s.role)+'</b> · looks after '+esc(s.cats.slice(0,4).join(', '))+(s.cats.length>4?'…':'')+'</p>':'');
      const cur=$('#g-cat')?$('#g-cat').value:'';$('#g-catwrap').innerHTML=catSelect('g-cat',G.staff,cur);}
    else if(G.type==='branch')who.innerHTML='<label class="f">Which branch<select class="inp" id="g-branch"><option value="">Choose a branch</option>'+CFG.branches.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>'<option value="'+b.code+'" '+(String(G.branch)===String(b.code)?'selected':'')+'>'+esc(b.name)+' · '+b.code+(b.bm?' · '+esc(b.bm):'')+'</option>').join('')+'</select></label>';
    else who.innerHTML='<label class="f">Which branches <span class="faint">('+(G.many.size||'all '+CFG.branches.length)+')</span></label><div class="quick" style="margin-top:6px"><button type="button" data-gall class="'+(G.many.size?'':'on')+'">All '+CFG.branches.length+'</button>'+CFG.branches.map(b=>'<button type="button" data-gm="'+b.code+'" class="'+(G.many.has(b.code)?'on':'')+'">'+esc(b.name)+'</button>').join('')+'</div>';
  };
  drawWho();
  const form=$('#give');
  form.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.gtype){G.type=b.dataset.gtype;form.querySelectorAll('[data-gtype]').forEach(x=>x.classList.toggle('on',x===b));drawWho()}
    else if(b.dataset.gs){G.staff=b.dataset.gs;drawWho()}
    else if(b.dataset.gm){const c=+b.dataset.gm;G.many.has(c)?G.many.delete(c):G.many.add(c);drawWho()}
    else if(b.hasAttribute('data-gall')){G.many.clear();drawWho()}
    else if(b.dataset.qd!=null){$('#g-due').value=iso(day(+b.dataset.qd));form.querySelectorAll('[data-qd]').forEach(x=>x.classList.toggle('on',x===b))}
    else if(b.id==='g-crit'){G.crit=!G.crit;b.classList.toggle('on',G.crit);b.setAttribute('aria-pressed',String(G.crit))}
  });
  form.addEventListener('change',e=>{
    if(e.target.id==='g-branch')G.branch=e.target.value;
    if(e.target.id==='g-due')form.querySelectorAll('[data-qd]').forEach(x=>x.classList.remove('on'));
    if(e.target.id==='g-cat'){$('#g-newcat').hidden=e.target.value!=='__new';if(e.target.value==='__new')$('#g-catname').focus()}
  });
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const text=$('#g-text').value.trim(),due=fromIso($('#g-due').value);
    if(!text){toast('Write what the task is');return}
    if(due==null){toast('Pick a due date');return}
    let to;
    if(G.type==='staff'){if(!G.staff){toast('Pick a person');return}to={type:'staff',id:G.staff}}
    else if(G.type==='branch'){if(!G.branch){toast('Pick a branch');return}to={type:'branch',code:+G.branch}}
    else{const codes=G.many.size?[...G.many]:CFG.branches.map(b=>b.code);to={type:'many',codes,replied:Object.fromEntries(codes.map(c=>[c,false]))}}
    let cat=$('#g-cat').value;
    if(cat==='__new'){cat=$('#g-catname').value.trim();if(!cat){toast('Name the new category');return}
      const g=CFG.cats.find(x=>x.group===$('#g-catgrp').value);if(g&&!g.items.includes(cat))g.items.push(cat);saveCfg()}
    if(!cat){toast('Choose a category');return}
    const n=TASKS.reduce((m,t)=>Math.max(m,parseInt(t.id.slice(1),10)||0),0)+1;
    const note=$('#g-note').value.trim();
    const t={id:'T'+String(n).padStart(4,'0'),to,cat,text,how:$('#g-how').value,given:TODAY,due,src:$('#g-src').value,crit:G.crit,status:'open',doneOn:null,snooze:null,hist:[{d:TODAY,k:'given',x:note}]};
    TASKS=TASKS.concat([t]);save();closeSheet();render();
    toast('Saved. Reminder on '+pretty(due-CFG.remindBefore*DAY<TODAY?TODAY:due-CFG.remindBefore*DAY));
  });
}

function csvText(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['ID','Given to','Type','Category','Group','Task','How','Given','Due','Status','Done on','Days late','Source','Critical','Reminded times'];
  const rows=TASKS.map(t=>[t.id,whoName(t),t.to.type,t.cat,groupOf(t.cat),t.text,t.how,iso(t.given),iso(t.due),t.status,t.doneOn?iso(t.doneOn):'',isOver(t)?daysLate(t):'',SOURCES[t.src],t.crit?'yes':'',remCount(t)]);
  return [head].concat(rows).map(r=>r.map(q).join(',')).join('\n');
}
function copyText(txt,okMsg){
  const done=()=>toast(okMsg||'Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>toast('Could not copy here. Select the text instead.'));
  else toast('Could not copy here. Select the text instead.');
}

// ---------- Events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a,[data-go]');if(!b)return;
  const d=b.dataset;
  if(d.tab!=null){S.tab=d.tab;S.chase='all';history.replaceState(null,'','#'+d.tab);render();window.scrollTo(0,0);return}
  if(d.go!=null){S.tab=d.go;if(d.filter)S.filter=d.filter;if(d.grp!=null)S.grp=d.grp;history.replaceState(null,'','#'+d.go);render();window.scrollTo(0,0);return}
  if(d.chase!=null){S.chase=S.chase===d.chase?'all':d.chase;render();return}
  if(d.expand!=null){S.expand[d.expand]=!S.expand[d.expand];render();return}
  if(d.sort!=null){S.sort=d.sort;render();return}
  if(d.filter!=null&&S.tab==='tasks'){S.filter=d.filter;render();return}
  if(d.grp!=null&&S.tab==='tasks'&&!d.go){S.grp=d.grp;render();return}
  if(b.id==='fab'){openGive();return}
  if(b.id==='bell'){openReminders();return}
  if(b.hasAttribute('data-close')){closeSheet();return}
  if(d.task!=null){openTask(d.task);return}
  if(d.person!=null){openPerson(d.person);return}
  if(d.branch!=null){openBranch(+d.branch);return}
  if(d.giveStaff!=null){openGive({type:'staff',staff:d.giveStaff});return}
  if(d.giveBranch!=null){openGive({type:'branch',branch:d.giveBranch});return}
  if(d.done!=null){markDone(d.done);return}
  if(d.reopen!=null){reopen(d.reopen);return}
  if(d.remind!=null){openRemind(d.remind);return}
  if(d.send!=null){sendReminder(d.send);return}
  if(d.snooze!=null){snooze(d.snooze);return}
  if(d.extend!=null){extendForm(d.extend);return}
  if(d.addnote!=null){noteForm(d.addnote);return}
  if(d.pendlist!=null){const s=staffOf(d.pendlist);const o=byUrgency(staffTasks(d.pendlist).filter(open));const txt=pendingListText(s.name.split(' ')[0],o);
    sheet('Pending list for '+esc(s.name),plural(o.length,'open task'),'<div class="msg" id="rtext">'+esc(txt)+'</div><div class="cbtns">'+(digits(s.mobile)?'<a class="btn wa" href="https://wa.me/91'+digits(s.mobile)+'?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener">'+ICON.wa+' Open WhatsApp</a>':'<button class="btn wa off">'+ICON.wa+' No mobile saved</button>')+'<button class="btn" data-copy>'+ICON.copy+' Copy text</button></div><div class="btns"><button class="btn sm ghost" data-person="'+s.id+'">← Back</button></div>');return}
  if(b.hasAttribute('data-cancelform')){$('#taskform').innerHTML='';return}
  if(d.tick!=null){const [id,c]=d.tick.split(':');const t=TASKS.find(x=>x.id===id);t.to.replied[c]=!t.to.replied[c];save();render();openCircular(t);return}
  if(d.more!=null){({people:openPeopleList,branches:openBranchList,cats:openCats,about:openAbout,data:openData,csv:()=>copyText(csvText(),'All tasks copied as CSV')})[d.more]();return}
  if(d.editStaff!=null){openStaffEditor(d.editStaff);return}
  if(d.delStaff!=null){const s=staffOf(d.delStaff);if(staffTasks(s.id).some(open)){toast('Has open tasks');return}
    TASKS.forEach(t=>{if(t.to.type==='staff'&&t.to.id===s.id)t.to.name=s.name});CFG.staff=CFG.staff.filter(x=>x.id!==s.id);CFG.staff.forEach(x=>{if(x.sub===s.id)x.sub=''});save();saveCfg();render();openPeopleList();toast('Removed '+s.name);return}
  if(d.editBranch!=null){openBranchEditor(d.editBranch===''?'':+d.editBranch);return}
  if(d.delBranch!=null){const br=branchOf(d.delBranch);if(branchTasks(br.code).length){toast('Has tasks');return}
    TASKS.forEach(t=>{if(t.to.type==='many'&&t.to.codes.includes(br.code)){t.to.codes=t.to.codes.filter(c=>c!==br.code);delete t.to.replied[br.code]}});
    CFG.branches=CFG.branches.filter(x=>x.code!==br.code);save();saveCfg();render();openBranchList();toast('Removed '+br.name);return}
  if(d.delCat!=null){CFG.cats.forEach(g=>{g.items=g.items.filter(c=>c!==d.delCat)});CFG.staff.forEach(s=>{s.cats=s.cats.filter(c=>c!==d.delCat)});saveCfg();openCats();toast('Removed '+d.delCat);return}
  if(d.rb!=null){CFG.remindBefore=+d.rb;saveCfg();render();return}
  if(d.theme!=null){CFG.theme=d.theme;saveCfg();render();return}
  if(d.lang!=null){CFG.lang=d.lang;saveCfg();render();return}
  if(d.langR!=null){CFG.lang=d.langR;saveCfg();layer.querySelectorAll('[data-lang-r]').forEach(x=>x.classList.toggle('on',x===b));const id=layer.querySelector('[data-send]').dataset.send;const t=TASKS.find(x=>x.id===id);const txt=remindText(t);$('#rtext').textContent=txt;const wl=$('#walink');if(wl)wl.href='https://wa.me/91'+digits(mobileOf(t))+'?text='+encodeURIComponent(txt);return}
  if(b.hasAttribute('data-copy')){copyText($('#rtext').textContent);return}
  if(b.hasAttribute('data-reset')){TASKS=RAW.map(build);save();render();toast('Sample tasks reset');return}
  if(b.hasAttribute('data-reset-cfg')){CFG=clone(DEFAULT_CFG);saveCfg();render();toast('Lists and settings reset');return}
});
document.addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML)closeSheet()});

render();
})();
</script>
